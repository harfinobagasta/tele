name: Telegram History Cloner (1 Bulan Terakhir)

on:
  workflow_dispatch:
    inputs:
      history_days:
        description: 'Jumlah hari riwayat yang ingin di-clone (default 30 hari)'
        required: false
        default: '30'

jobs:
  clone-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run History Cloner
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '30' }}
        run: |
          python clone_history.py
